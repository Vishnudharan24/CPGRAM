services:
  # Database Service
  - type: psql
    name: cpgrams-db
    plan: free # Change to starter or higher for production
    databaseName: cpgrams_grievance
    user: cpgrams_admin

  # Backend FastAPI Service
  - type: web
    name: cpgrams-backend
    env: python
    rootDir: backend
    plan: free # Change to starter or higher for production
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && python -m app.services.seed_mock_data && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cpgrams-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.0

  # Frontend Vite/React Service (Static Site)
  - type: web
    name: cpgrams-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: "npm ci && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: 20
    routes:
      # Proxy all /api requests to the backend
      - type: rewrite
        source: /api/*
        destination: https://cpgrams-backend.onrender.com/api/*
      # Handle React Router fallback
      - type: rewrite
        source: /*
        destination: /index.html
